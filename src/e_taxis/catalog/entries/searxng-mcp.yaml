id: searxng-mcp
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: [searxng]
recipes:
  any:
    primitive: claude-mcp
    with: {name: searxng, package: "mcp-searxng", note: "argv and env as e-engineer core/engineer/config/mcp.yaml renders them"}
probe: claude mcp get searxng
verify: claude mcp get searxng
uninstall: {primitive: claude-mcp, with: {name: searxng, remove: true}}
footprint: [~/.claude.json#mcpServers.searxng]
owns: []
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer core/engineer/config/mcp.yaml"}
