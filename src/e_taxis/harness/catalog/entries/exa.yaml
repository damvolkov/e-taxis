id: exa
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: []
recipes:
  claudecode:
    primitive: claude-mcp
    with: {name: exa, transport: http, url: "https://mcp.exa.ai/mcp"}
  opencode:
    primitive: settings
    with: {file: ~/.config/opencode/opencode.json, key: "mcp.exa", value: {type: remote, url: "https://mcp.exa.ai/mcp"}}
probe: claude mcp get exa
verify: claude mcp get exa
uninstall: {primitive: claude-mcp, with: {name: exa, remove: true}}
footprint: [~/.claude.json#mcpServers.exa, ~/.config/opencode/opencode.json#mcp.exa]
owns: [mcp.exa]
gate: {licence: "proprietary hosted service — queries leave the machine", secrets: [], confirm: false}
flags: {note: "in Claude Code only a fallback: the account's WebSearch comes first"}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer core/engineer/config/mcp.yaml"}
