id: otel-env
kind: env
targets: [claudecode]
scope: user
requires: [otel]
recipes:
  claudecode:
    primitive: settings
    with:
      file: ~/.claude/settings.json
      env:
        CLAUDE_CODE_ENABLE_TELEMETRY: "1"
        OTEL_METRICS_EXPORTER: otlp
        OTEL_LOGS_EXPORTER: otlp
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:45910"
probe: python3 -c "import json,os;print(json.load(open(os.path.expanduser('~/.claude/settings.json'))).get('env',{}).get('CLAUDE_CODE_ENABLE_TELEMETRY',''))"
verify: python3 -c "import json,os,sys;sys.exit(0 if json.load(open(os.path.expanduser('~/.claude/settings.json'))).get('env',{}).get('CLAUDE_CODE_ENABLE_TELEMETRY')=='1' else 1)"
uninstall: {primitive: settings, with: {file: ~/.claude/settings.json, remove_env: true}}
footprint: ["~/.claude/settings.json#env.CLAUDE_CODE_ENABLE_TELEMETRY", "~/.claude/settings.json#env.OTEL_*"]
owns: [env.CLAUDE_CODE_ENABLE_TELEMETRY, env.OTEL_METRICS_EXPORTER, env.OTEL_LOGS_EXPORTER, env.OTEL_EXPORTER_OTLP_PROTOCOL, env.OTEL_EXPORTER_OTLP_ENDPOINT]
gate: {licence: null, secrets: [], confirm: false}
flags: {redaction: "never OTEL_LOG_TOOL_DETAILS / OTEL_LOG_USER_PROMPTS here — they store content; audit pipeline only"}
status: {profile: {house: floor, company: floor, minimal: out}, checked: 2026-10-15, evidence: "e-engineer docs/bench/observability.md"}
