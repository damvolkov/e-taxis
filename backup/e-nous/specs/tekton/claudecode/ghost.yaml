# Machine spec — how a phantom Claude Code is raised in a sandbox and what it must see. Data, not code.
# Consumed by ops/trial (tests/integration). Placeholders: ${home} ${tree} ${llm} ${path} ${profile} ${port} ${document} ${name} ${mcp}.
# Verified 2026-10-06 against claude 2.1.291 under the Landlock fence: 31/31 skills, 11/11 agents, persona in the system prompt.
backend: claudecode
release: "2026.10.06"
verified: "2026-10-06"
status: ready
sources: ["https://code.claude.com/docs/en/settings.md", "https://code.claude.com/docs/en/llm-gateway.md"]
tree: .claude                          # home-relative: where the live tree sits under any home
llm: anthropic                         # the fake endpoint answers POST /v1/messages
network: local                         # nothing but the fake endpoint is reachable
env:
  PATH: ${path}
  HOME: ${home}
  TMPDIR: ${home}/tmp
  CLAUDE_CONFIG_DIR: ${tree}
  ANTHROPIC_BASE_URL: ${llm}
  ANTHROPIC_API_KEY: sk-ghost
  DISABLE_TELEMETRY: "1"
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_MAX_RETRIES: "0"
state:                                 # an established install: a fresh ~/.claude.json runs migrations that rewrite settings.model (opus → opus[1m])
  - path: ${home}/.claude.json
    text: '{"migrationVersion": 14, "opusProMigrationComplete": true, "sonnet1m45MigrationComplete": true, "hasCompletedOnboarding": true}'
probes:
  - { name: session, kind: capture, argv: [claude, -p, ghost, --max-turns, "1"] }
sees:
  persona: [session]                   # CLAUDE.md verbatim in `system`
  skill: [session]                     # the Skill tool lists every skill
  agent: [session]                     # the Agent tool lists every subagent
notes: "La sesión falla con 400 a propósito: la petición ya llegó y es lo que se lee. Sin tokens ni red: ANTHROPIC_BASE_URL apunta al endpoint falso del sandbox."
