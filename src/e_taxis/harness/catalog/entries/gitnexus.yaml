id: gitnexus
kind: mcp
targets: [claudecode, opencode]
scope: project
requires: []
recipes:
  claudecode:
    primitive: claude-mcp
    with: {name: gitnexus, scope: project, command: npx, args: ["-y", "gitnexus@1.6.12", "mcp"], index: "npx -y gitnexus@1.6.12 analyze --index-only"}
probe: npx -y gitnexus@1.6.12 --version
verify: npx -y gitnexus@1.6.12 --version
uninstall: {primitive: claude-mcp, with: {name: gitnexus, scope: project, remove: true}}
footprint: ["<repo>/.gitnexus", "<repo>/.mcp.json#mcpServers.gitnexus", ~/.gitnexus/registry.json]
owns: []
gate: {licence: "PolyForm-Noncommercial-1.0.0 — a commercial licence before company use", secrets: [], confirm: true}
flags: {index: "--index-only (without it analyze writes AGENTS.md, CLAUDE.md, skills and hooks into the repo)"}
status: {profile: {house: per-project, company: per-project, minimal: out}, checked: 2026-10-15, evidence: "e-engineer docs/bench/tools.md — wanted; never called unguided"}
