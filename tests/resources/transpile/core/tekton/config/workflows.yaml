# workflows — the ontology every workflow speaks: one typed vocabulary of kwargs, and the families that share nodes.
# A workflow names the kwargs it takes (`parameters: [project, query]`) and may refine one; a family's kwargs join every
# member's, and its nodes are written once and used as {use: <node>, depends, inputs, outputs}. taxis expands both at
# load and binds by type: a bool is true or false, an enum one of its values, a topic a key of soa.yaml, a path one
# that exists; `project` left empty is the git root of the terminal the run was launched from.
kwargs:
  project: {type: project, doc: "the repository; empty = the root of the git project the terminal is in"}
  publish: {type: bool, default: "false", doc: "true to promote, push or open the PR at the end; false stops at the report"}
  apply:   {type: bool, default: "false", doc: "true to run the commands that apply the musts at the end"}
  bench:   {type: bool, default: "true", doc: "false judges on desk evidence alone; true installs and measures for real"}
  topic:   {type: topic, doc: "a topic of soa.yaml; empty = the whole plane"}
  deliver: {type: str, values: [report, discord], default: report, doc: "report writes it; discord also posts it"}
  query:   {type: str, doc: "what you ask, in your words"}
  tech:    {type: str, doc: "a technology: a repository URL, a package or a name"}
  entity:  {type: str, values: [skill, agent, command, workflow, tool, persona, config], doc: "an entity kind of the corpus"}
  ids:     {doc: "subjects, space-separated; empty = every subject of the kind"}
  backend: {type: str, values: [opencode, claudecode], doc: "a tekton backend; empty = every backend"}
families:
  soa:
    kwargs: [topic]
    nodes:
      health:
        run: taxis workflow {{workflow}} health --rundir {{rundir}}
        instruction: >-
          Every subject's health from no-auth sources, dated — last release and cadence, downloads, dependents,
          Scorecard, licence, open-issue ratio, contributors — a source that fails leaves its field empty and named. No model.
      bench:
        run: taxis workflow {{workflow}} bench --rundir {{rundir}} --bench {{bench}}
        timeout: 7200
        instruction: >-
          Every plan's arms installed fresh in their own fenced sandbox and run: warm-up discarded, arms interleaved,
          raw samples kept, an install that fails recorded as the arm's result. bench=false or overlap none installs
          nothing and records the run as not measured, so the verdict still comes — never as adopt or replace.
      stats:
        run: taxis workflow {{workflow}} stats --rundir {{rundir}}
        instruction: >-
          Per plan, the paired bootstrap interval of the difference on its primary metric against its threshold:
          better, worse, no difference or not measured; secondary metrics described, never deciding. No model.
      adversary:
        actor: verifier-adversary
        readonly: true
        instruction: >-
          Try to sink every verdict with its own evidence: a subject the repository or the corpus does not really run,
          a rival that is a wrapper, an arm that was not comparable, a metric chosen after the runs, a health datum
          without a date, an incumbent that was not the real one, a migration cost left out. What survives stands.
          Answer with one ```json block that fits this step's output schema in
          {{nous}}/core/tekton/workflows/{{workflow}}/schemas/ (Review.json for one verdict, Reviews.json for several).
