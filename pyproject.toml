##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-taxis"
dynamic = ["version"]
description = "e-taxis — mounts agent harnesses: resolves the stack a harness needs, plans and installs it after the transpile, verifies it, undoes it"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Environment :: Console",
    "Operating System :: POSIX",
]
dependencies = [
    ##### core #####
    "cyclopts>=4.25.3",
    "structlog>=26.1",
    ##### data #####
    "msgspec>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    ##### crypto #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "anyio>=4.15.1",
    ##### http #####
    "wreq>=0.10",
    ##### telemetry #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ##### stores — psqlpy (Rust driver, pgvector native); awa, the durable background engine #####
    "redis>=6.2",
    "aiosqlite>=0.20",
    "psqlpy>=0.12",
    "awa-pg>=0.6.9",
    "beartype>=0.22.9",
    ##### documents — liteparse (Rust, in-process) first, docling-serve for what it reads better; polars frames #####
    "liteparse>=2.14",
    "polars>=2.0",
    "e-serde>=0.5",
]

[project.scripts]
taxis = "e_taxis.cli:main"
### the same tree under the house verb: inside this project's environment, `op` is the front door.
op = "e_taxis.cli:main"

[project.urls]
Homepage = "https://github.com/damvolkov/e-taxis"
Source = "https://github.com/damvolkov/e-taxis"
Issues = "https://github.com/damvolkov/e-taxis/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "fakeredis>=2.38.0",
    "pytest-resources[serde]>=0.3.2",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4",
    ### structural rewrite of arkhetypo's e-infra at materialization time (scripts/materialize.py); parses real 3.14 syntax.
    "libcst>=1.9",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
### pytest-resources is first-party and can publish same-day; exempt it from the freshness guard.
exclude-newer-package = { "pytest-resources" = "2100-01-01T00:00:00Z" }
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build]
### the sections materialize inside e_taxis from arkhetypo (never committed — see .gitignore): artifacts ship them despite the VCS ignore.
artifacts = [
    "src/e_taxis/engines/",
    "src/e_taxis/infra/",
    "src/e_taxis/ports/",
    "src/e_taxis/processors/",
    "src/e_taxis/providers/",
    ### `ops` is the shared home: the generated files ship by name, the project's own are committed as normal.
    "src/e_taxis/ops/crypto.py",
    "src/e_taxis/ops/file.py",
    "src/e_taxis/ops/hash.py",
    "src/e_taxis/ops/image.py",
    "src/e_taxis/ops/registry.py",
    "src/e_taxis/ops/wrappers.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/e_taxis"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]

##### LINT #####
[tool.ruff]
line-length = 120
extend-exclude = ["backup", "tests/resources"]
force-exclude = true
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
### tests inject fixtures by parameter and set up their temp trees with plain pathlib inside async tests.
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT", "PLR0917", "ASYNC240"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### cyclopts and msgspec resolve annotations at runtime — type-checking imports would break them.
"src/e_taxis/harness/commands/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/harness/models/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/harness/runtime/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/transpile/commands/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/transpile/models/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/workflow/commands/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/workflow/models/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/schedule/commands/**" = ["TC001", "TC002", "TC003"]
"src/e_taxis/schedule/models/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["e_taxis"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "e_taxis.infra.config.base.BaseSettings",
    "msgspec.Struct",
    "e_taxis.infra.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
### fixture projects (a repository radar-stack reads) are data, not this repo's code — ruff excludes them too.
exclude = ["tests/resources"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: slow tests (deselect with -m 'not slow')"]

##### COVERAGE #####
[tool.coverage.run]
### the materialized sections are tested at their source (arkhetypo): the gate covers the project tool alone.
### `ops` is shared: the e-infra files are omitted by name, the project's own stay under the gate.
### `project` is the e-management engine ported ahead of its suite (the entry becomes cyclopts cards first, F3.1):
### interim omit — the gate must not lie about code it has not seen tested. Remove when tests/unit/e_taxis/project is green.
omit = [
    "*/src/e_taxis/engines/*",
    "*/src/e_taxis/infra/*",
    "*/src/e_taxis/ports/*",
    "*/src/e_taxis/processors/*",
    "*/src/e_taxis/providers/*",
    "*/src/e_taxis/project/*",
    "*/src/e_taxis/ops/crypto.py",
    "*/src/e_taxis/ops/file.py",
    "*/src/e_taxis/ops/hash.py",
    "*/src/e_taxis/ops/image.py",
    "*/src/e_taxis/ops/registry.py",
    "*/src/e_taxis/ops/wrappers.py",
]
source_pkgs = ["e_taxis"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
