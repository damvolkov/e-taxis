id: playwright-mcp
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: [playwright]
recipes:
  any:
    primitive: claude-mcp
    with: {name: playwright, package: "@playwright/mcp@0.0.56", note: "argv and env as e-engineer core/engineer/config/mcp.yaml renders them"}
probe: claude mcp get playwright
verify: claude mcp get playwright
uninstall: {primitive: claude-mcp, with: {name: playwright, remove: true}}
footprint: [~/.claude.json#mcpServers.playwright]
owns: []
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer core/engineer/config/mcp.yaml"}
