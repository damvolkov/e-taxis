# hooks — the fixture's slice of the house vocabulary: e-nous's hooks plus a witness on every moment both coders
# realize, so a trial's answered turn must exec each of them (sh -c 'exit 0' <event> is unique in an exec trace).
session_start:
  - matchers: [startup]
    run: [node, "{out}/hooks/autolearn.mjs", start]
    backends: [claudecode]
  - matchers: [startup]
    run: [sh, -c, "exit 0", session_start]
prompt_submit:
  - run: [sh, -c, "exit 0", prompt_submit]
tool_before:
  - matchers: [bash]
    run: [sh, -c, "exit 0", tool_before]
tool_after:
  - matchers: [bash]
    run: [sh, -c, "exit 0", tool_after]
turn_end:
  - run: [node, "{out}/hooks/autolearn.mjs", stop]
    backends: [claudecode]
  - run: [node, "{out}/hooks/plans.mjs"]
session_end:
  - run: [node, "{out}/hooks/autolearn.mjs", end]
    backends: [claudecode]
