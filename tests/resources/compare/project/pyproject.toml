[project]
name = "sample"
version = "0.1.0"
dependencies = [
    "msgspec>=0.21",
    "wreq>=0.10 ; python_version >= '3.12'",
    "e-serde[yaml]>=0.5",
    "PyYAML>=6",
]

[project.optional-dependencies]
