id: searxng
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: [searxng-server]
recipes:
  claudecode:
    primitive: claude-mcp
    with: {name: searxng, command: npx, args: ["-y", "mcp-searxng"], env: {"SEARXNG_URL": "http://localhost:45600"}}
  opencode:
    primitive: settings
    with: {file: ~/.config/opencode/opencode.json, key: "mcp.searxng", value: {type: local, command: ["npx", "-y", "mcp-searxng"], environment: {"SEARXNG_URL": "http://localhost:45600"}}}
probe: claude mcp get searxng
verify: claude mcp get searxng
uninstall: {primitive: claude-mcp, with: {name: searxng, remove: true}}
footprint: [~/.claude.json#mcpServers.searxng, ~/.config/opencode/opencode.json#mcp.searxng]
owns: [mcp.searxng]
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-nous core/tekton/config/mcp.yaml"}
