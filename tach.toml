##### ROOTS #####
source_roots = ["src"]
exclude = ["tests"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails.
# The harness branch owns the command tree (cli), its composition root (runtime), the use cases (services)
# and its contracts (models). The transpile and workflow branches take the same layers: commands → services →
# engine (processors) → adapters → models. The materialized sections and the shared floor — `adapters` (e-core files beside
# the project's own), `core`, `ops`, `processors` — sit below and serve every branch, harness and project alike.
layers = ["cli", "runtime", "services", "processors", "adapters", "core", "ops", "models"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_taxis.cli"
layer = "cli"
depends_on = []

[[modules]]
path = "e_taxis.harness.commands"
layer = "cli"
depends_on = ["e_taxis.transpile.commands"]

[[modules]]
path = "e_taxis.harness.runtime"
layer = "runtime"
depends_on = []

[[modules]]
path = "e_taxis.harness.services"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_taxis.project"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.processors"
layer = "processors"
depends_on = []

[[modules]]
path = "e_taxis.core"
layer = "core"
depends_on = []

[[modules]]
path = "e_taxis.ops"
layer = "ops"
depends_on = []

[[modules]]
path = "e_taxis.transpile.commands"
layer = "cli"
depends_on = []

[[modules]]
path = "e_taxis.transpile.services"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.transpile.engine"
layer = "processors"
depends_on = ["e_taxis.transpile.codecs"]

[[modules]]
path = "e_taxis.transpile.codecs"
layer = "processors"
depends_on = []

[[modules]]
path = "e_taxis.transpile.transforms"
layer = "processors"
depends_on = ["e_taxis.transpile.engine"]

[[modules]]
path = "e_taxis.transpile.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_taxis.transpile.models"
layer = "models"
depends_on = ["e_taxis.harness.models"]

[[modules]]
path = "e_taxis.workflow.commands"
layer = "cli"
depends_on = []

[[modules]]
path = "e_taxis.workflow.services"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.workflow.distill"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.workflow.sweep"
layer = "services"
depends_on = []

### soa-assess reads agent answers with reverse-distill's own fence pattern.
[[modules]]
path = "e_taxis.workflow.assess"
layer = "services"
depends_on = ["e_taxis.workflow.distill"]

### soa-compare's pairs are assess plans; it is handed assess's bench, health and stats, never imports them to run.
[[modules]]
path = "e_taxis.workflow.compare"
layer = "services"
depends_on = []

### the planes' nodes render and check through the transpiler's own services (v2), never a second render.
[[modules]]
path = "e_taxis.workflow.plane"
layer = "services"
depends_on = ["e_taxis.transpile.services", "e_taxis.workflow.distill"]

[[modules]]
path = "e_taxis.workflow.engine"
layer = "processors"
depends_on = []

### the public-API reader names wreq's transport failures once, with the downloader.
[[modules]]
path = "e_taxis.workflow.adapters"
layer = "adapters"
depends_on = ["e_taxis.adapters"]

[[modules]]
path = "e_taxis.workflow.models"
layer = "models"
depends_on = ["e_taxis.harness.models", "e_taxis.transpile.models"]

[[modules]]
path = "e_taxis.harness.models"
layer = "models"
depends_on = []

[[modules]]
path = "e_taxis.schedule.commands"
layer = "cli"
depends_on = ["e_taxis.harness.commands"]

[[modules]]
path = "e_taxis.schedule.services"
layer = "services"
depends_on = []

[[modules]]
path = "e_taxis.schedule.adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "e_taxis.schedule.models"
layer = "models"
depends_on = ["e_taxis.harness.models"]
