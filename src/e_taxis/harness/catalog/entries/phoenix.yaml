id: phoenix
kind: service
targets: [system]
scope: service
requires: []
recipes:
  any:
    primitive: compose
    with: {path: ~/.config/compose/phoenix, image: "arizephoenix/phoenix", port: 45900}
probe: docker inspect -f '{{.Config.Image}}' phoenix
verify: curl -fs http://127.0.0.1:45900/healthz
uninstall: {primitive: compose, with: {path: ~/.config/compose/phoenix, down: true}}
footprint: [~/.config/compose/phoenix, ~/.config/compose/data/phoenix]
owns: []
gate: {licence: "Elastic-2.0 — free for internal use, not as a managed service", secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: per-project, minimal: out}, checked: 2026-10-15, evidence: "e-nous docs/bench/observability.md"}
