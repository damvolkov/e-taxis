id: codebase-memory-mcp
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: []
recipes:
  claudecode:
    primitive: claude-mcp
    with: {name: codebase-memory-mcp, command: ~/.local/bin/codebase-memory-mcp, args: []}
  opencode:
    primitive: settings
    with: {file: ~/.config/opencode/opencode.json, key: "mcp.codebase-memory-mcp", value: {type: local, command: [~/.local/bin/codebase-memory-mcp]}}
probe: codebase-memory-mcp --version
verify: codebase-memory-mcp --version
uninstall: {primitive: claude-mcp, with: {name: codebase-memory-mcp, remove: true}}
footprint: [~/.local/bin/codebase-memory-mcp, ~/.cache/codebase-memory-mcp]
owns: [mcp.codebase-memory-mcp]
gate: {licence: null, secrets: [], confirm: false}
flags: {pin: "0.6.0", singleton: "≥ v0.11 is an account-wide singleton: every client must run the exact same build", bench: "never called unguided, not even under its SessionStart reminder (part 2)"}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer docs/bench/tools.md"}
