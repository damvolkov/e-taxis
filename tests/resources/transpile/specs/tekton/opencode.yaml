# ═══════════════════════════════════════════════════════════════════════════
# specs/tekton/opencode.yaml — OpenCode: the single file the transpiler
# reads. Template O (specs/base.yaml). Data, not code.
# ═══════════════════════════════════════════════════════════════════════════

spec: "2.0"
backend: opencode
harness: tekton
product: OpenCode
status: ready
tree: .config/opencode                # OPENCODE_CONFIG_DIR moves it
govern: [skills, agents, commands, workflows, mcp]
foreign:
  - {path: skills/opencode-skill-creator, why: "shipped by the opencode-skill-creator plugin, which keeps it current"}

upstream:
  version: 2.2.0                                                # GitHub releases — the first non-prerelease 2.x (npm @latest still 1.19.4); read 2026-10-28
  channel: https://github.com/anomalyco/opencode/releases
  read: "2026-10-28"
  verified: {version: 2.2.0, date: "2026-10-28"}                # the fenced trial holds on 2.2.0 (3/3): persona, skills, agents, commands; the v1-shaped config is normalized by 2.x

sources:
  - {url: "https://registry.npmjs.org/opencode-ai/latest", kind: npm, covers: [upstream]}
  - {url: "https://github.com/anomalyco/opencode/releases.atom", kind: atom, covers: [upstream], note: "release notes: reclassify into sections"}
  - {url: "https://opencode.ai/docs/rules/", kind: html, covers: [persona, config]}
  - {url: "https://opencode.ai/docs/skills/", kind: html, covers: [skill]}
  - {url: "https://opencode.ai/docs/agents/", kind: html, covers: [agent, config]}
  - {url: "https://opencode.ai/docs/commands/", kind: html, covers: [command]}
  - {url: "https://opencode.ai/docs/config/", kind: html, covers: [config]}
  - {url: "https://opencode.ai/docs/permissions/", kind: html, covers: [agent, config]}
  - {url: "https://opencode.ai/docs/mcp-servers/", kind: html, covers: [config]}
  - {url: "https://opencode.ai/docs/providers/", kind: html, covers: [config]}
  - {url: "https://opencode.ai/docs/plugins/", kind: html, covers: [config]}
  - {url: "https://opencode.ai/config.json", kind: json, covers: [config], note: "the config schema: a new root key = a new surface"}

targets:
  AGENTS.md:            {format: md, audience: all, absorb: true}       # global rules; ~/.claude/CLAUDE.md is only a fallback when this is missing
  skills/{id}/SKILL.md: {format: md+fm, absorb: true}
  agents/{id}.md:       {format: md+fm}
  commands/{id}.md:     {format: md+fm}
  workflows/{id}.md:    {format: md+fm}                                 # no native type: a house convention the /workflow command walks
  opencode.jsonc:       {format: json}
  tui.json:             {format: json}
  package.json:         {format: json}
  mcp/playwright.json:  {format: file}
  hooks/plans.mjs:      {format: file}                                  # the one plans check, shared with Claude Code
  plugins/plans.js:     {format: file}                                  # the plans law as a v2 plugin (session.idle → prompt)
  plugins/autolearn.js: {format: file}                                  # autolearn's v2 shell (upstream autolearn-v2.js, pinned in stack.yaml)
  plugins/autolearn-core.mjs: {format: file}                            # its core — Claude Code's autolearn hook imports the same file
  mcp/codegraph.md:     {format: file}                                  # codebase-memory's guide, loaded through #instructions (OpenCode only)

map:

  persona:
    kind: persona
    target: AGENTS.md
    rows:
      - {from: name,        to: "#h1"}
      - {from: essence,     to: "#para"}
      - {from: epigraph,    to: "#quote"}
      - {from: origin,      to: "#Damien"}
      - {from: unity,       to: "#One mind, two materials"}
      - {from: temperament, to: "#Temperament"}
      - {from: face,        to: "#The engineer"}
      - {from: stance,      to: "#Philosophy and logic", glue: "\n"}
      - {from: reasoning,   to: "#Philosophy and logic", glue: "\n"}
      - {from: voice,       to: "#Voice", glue: "\n"}
      - {from: critique,    to: "#Voice", glue: "\n"}
      - {from: prudence,    to: "#Method: prudence before action", glue: "\n"}
      - {from: method,      to: "#Method: prudence before action", glue: "\n"}
      - {from: plans,       to: "#Plans"}
      - {from: honesty,     to: "#Honesty"}
      - {from: soul,        to: "#Engineering soul"}
      - {from: knowledge,   to: "#Knowledge architecture"}
      - {from: categories,  to: "#Software categories"}
      - {from: triad,       to: "#The Triad", glue: "\n\n"}
      - {from: pillars,     to: "#The Triad", glue: "\n\n"}
      - {from: rules,       to: "#Skill creation rules"}
      - {from: conduct,     to: "#Operating contract", glue: "\n"}
      - {from: contract,    to: "#Operating contract", glue: "\n"}
      - {from: skills,      to: "#Skills"}
      - {from: agents,      to: "#Agents"}
    unmapped:
      about:   {reason: house, detail: "bond slot: human-hemisphere content; the tekton harness renders doctrine, not bond"}
      profile: {reason: house, detail: "user memory seed: only the nomos harnesses plant it"}

  skill:
    kind: instanced
    target: "skills/{id}/SKILL.md"
    rows:
      - {from: name,         to: "#fm.name", required: true}
      - {from: description,  to: "#fm.description", required: true}
      - {from: metadata,     to: "#fm.metadata"}
      - {from: name,         to: "#title"}
      - {from: instructions, to: "#body", required: true}
      - {from: references,   to: "#copy"}
    notes: >-
      Same SKILL.md as Claude Code's. OpenCode also discovers ~/.claude/skills
      and ~/.agents/skills: equal names collapse into one (`opencode debug
      skill`, 0 duplicates, 2026-10-02).

  agent:
    kind: instanced
    target: "agents/{id}.md"
    rows:
      - {from: description,    to: "#fm.description", required: true}
      - {from: mode,           to: "#fm.mode"}
      - {from: model,          to: "#fm.model", via: tier}
      - {from: max_steps,      to: "#fm.steps"}                       # steps, NOT maxSteps
      - {from: hidden,         to: "#fm.hidden"}
      - {from: permission,     to: "#fm.permission"}
      - {from: skills_preload, to: "#preload", via: [{join: ", "}, {template: "Load first: {value}."}]}   # no native preload; permission.skill is the net
      - {from: prompt,         to: "#body", required: true}
    unmapped:
      id:                {reason: covered, detail: "the file name is the id; no frontmatter name"}
      persona:           {reason: house, detail: "narrative identity of the role; it does not travel"}
      skills_ondemand:   {reason: house, detail: "permission.skill already allows them"}
      skills_full_scope: {reason: house, detail: "documents the role's scope; permission.skill carries the real gate"}
      mcp_servers:       {reason: covered, detail: "servers are registered at config level (#mcp); the per-agent scope rides in permission as <server>_<tool>"}

  command:
    kind: instanced
    target: "commands/{id}.md"
    rows:
      - {from: description, to: "#fm.description", required: true}
      - {from: agent,       to: "#fm.agent"}
      - {from: subtask,     to: "#fm.subtask"}
      - {from: template,    to: "#body", required: true, via: {positional: {slot: inputs, placeholder: "${n}"}}}   # $name → $1..$n in declaration order
    unmapped:
      id:     {reason: covered, detail: "the file name is the command"}
      inputs: {reason: covered, detail: "carried positional into the body by the template row"}
      skills: {reason: house, detail: "house wiring, not a frontmatter key"}

  workflow:
    kind: instanced
    target: "workflows/{id}.md"
    rows:
      - {from: id,          to: "#fm.id", required: true}
      - {from: description, to: "#fm.description", required: true}
      - {from: parameters,  to: "#fm.parameters"}
      - {from: nodes,       to: "#body", required: true, via: {graph: {output: output, loop: loop, start: start, done: done}}}
    unmapped:
      output:   {reason: covered, detail: "the graph combinator's output block"}
      loop:     {reason: covered, detail: "the graph combinator's loop block"}
      domains:     {reason: house, detail: "read by the renderer: an instance reaches only the harnesses of its domains"}
      family:      {reason: covered, detail: "expanded at load (adapters.ontology): its kwargs, output and nodes are in the instance"}
      each:        {reason: house, detail: "taxis fans the run out per item (engine and --harness); inside a session the command launches the workflow once per item"}
      triggers: {reason: house, detail: "eng-grammar phrases read by the channel hooks (e-metaxy), not by the coder"}
    notes: >-
      The lead agent (/workflow) walks the graph and delegates each node with
      task/@agent: siblings with the same depends and no edge run in parallel;
      a node with several parents joins; no actor = the lead acts; {{key}}
      references parameters.

  config:
    kind: config
    target: opencode.jsonc
    rows:
      - {value: "https://opencode.ai/config.json", to: "#$schema"}
      - {from: main.user,            to: "#username"}
      - {from: main.model.default,   to: "#model", via: tier}
      - {from: main.model.small,     to: "#small_model", via: tier}
      - {from: agents,               to: "#agent", via: agents_registry}
      - {from: plugins.opencode,     to: "#plugin"}
      - {value: false,               to: "#autoupdate"}              # pinned (stack.yaml): a self-update would leave the verified version
      - {from: main.instructions,    to: "#instructions", via: instructions_opencode}
      - {from: mcp.servers,          to: "#mcp", via: mcp_opencode}
      - {from: permissions.granular, to: "#permission"}
      - {from: models.providers,     to: "#enabled_providers", via: {pluck: id}}
      - {from: models,               to: "#provider", via: providers_tree}
      - {from: plugins.tui,          to: "tui.json#plugin"}
      - {from: plugins.sdk,          to: "package.json#dependencies", via: npm_dependency}
    assets:
      - {from: mcp/playwright.json, to: mcp/playwright.json}
      - {from: mcp/codegraph.md,    to: mcp/codegraph.md}
      - {from: hooks/plans.mjs,     to: hooks/plans.mjs}
      - {from: hooks/plans-opencode.js, to: plugins/plans.js}
      - {from: plugins/autolearn.js,      to: plugins/autolearn.js}
      - {from: plugins/autolearn-core.mjs, to: plugins/autolearn-core.mjs}
    unmapped:
      main.model.alias:          {reason: house, detail: "the session alias of a backend that sees no tiers (Claude's)"}
      main.effort:               {reason: pending, detail: "no global effort key known; per-model reasoning rides in the tier options (thinking budget) — confirm a global equivalent in the config schema"}
      main.display:              {reason: pending, detail: "Claude's fullscreen TUI; no equivalent key checked in tui.json"}
      telemetry:                 {reason: pending, detail: "OpenCode's OpenTelemetry surface not checked against the config schema"}
      hooks:                     {reason: absent, detail: "an OpenCode hook is a JS/TS plugin: code, not data — no deterministic projection from argv hooks (docs/plugins, checked 2026-10-02); the plans law ships as its own plugin asset instead (plugins/plans.js, 2026-10-27)"}
      plugins.claudecode:        {reason: house, detail: "Claude Code marketplace plugins"}
      models.providers.*.openai_url: {reason: internal, detail: "the OpenAI-compatible twin tools without an Anthropic client use (SkillSpector)"}
      models.tiers.*.note:       {reason: internal, detail: "cost documentation"}
      permissions.rules:         {reason: house, detail: "Claude's Tool(pattern) syntax; OpenCode's policy is #permission"}
      permissions.default_mode:  {reason: house, detail: "Claude's session mode; OpenCode's policy is #permission"}
      permissions.external_dirs: {reason: pending, detail: "permission.external_directory is a flat allow inside granular; whether it accepts per-path patterns is not checked"}
      security:                  {reason: internal, detail: "scanner acceptances, never rendered"}
      schedules:                 {reason: internal, detail: "unattended runs: taxis schedule renders them into systemd timers, never the harness"}
      soa:                       {reason: internal, detail: "soa-sweep's frame, read by taxis workflow soa-sweep, never the harness"}
      workflows:                 {reason: internal, detail: "the workflows' kwargs ontology and families, expanded by taxis at load"}
      mcp.servers.*.note:        {reason: pending, detail: "no description field known in an OpenCode MCP entry"}
      mcp.servers.*.smoke:       {reason: internal, detail: "evaluation data (taxis eval run config)"}
    notes: >-
      Every target is owned whole. Not governed, hence the harness's:
      plugins/ (the autolearn runtime, installed by e-taxis — listing it in
      #plugin would load it twice), node_modules/, package-lock.json and the
      plugins' own state files. A new provider, tier or plugin is a core
      change, never a row.

transforms:
  instructions_opencode:
    consumes: [main.instructions]
    binds: [out]
    returns: "opencode.jsonc#instructions — the path of every entry that reaches opencode (a bare path, or {path, backends} naming it), in order, {out} bound"
  agents_registry:
    consumes: [agents.overrides, agents.system, models.tiers.*.model, models.providers.*.id]
    returns: "opencode.jsonc#agent — overrides then system, each in order, every `model` tier resolved as the tier combinator does; a name in both is a gate error"
  providers_tree:
    consumes: [models.providers.*.id, models.providers.*.sdk, models.providers.*.display, models.providers.*.base_url, models.providers.*.api_key, models.tiers.*.model, models.tiers.*.reasoning, models.tiers.*.limits, models.tiers.*.modalities, models.tiers.*.options]
    returns: "opencode.jsonc#provider — {<id>: {npm: sdk, name: display, options: {baseURL, apiKey}, models: {<model>: {name: <tier>, reasoning?, limit?, modalities?, options?}}}}: only the tiers whose alias is that provider, in tier order, empty keys omitted"
  npm_dependency:
    consumes: [plugins.sdk]
    returns: "package.json#dependencies — 'package@version' → {package: version}, split at the last @"
  mcp_opencode:
    consumes: [mcp.servers.*.command, mcp.servers.*.url, mcp.servers.*.env, mcp.servers.*.headers, mcp.servers.*.backends]
    binds: [out]
    returns: "opencode.jsonc#mcp — servers whose backends include opencode (absent = all): {<name>: local {type: local, command: argv, environment?, enabled: true} | remote {type: remote, url, headers?, enabled: true}} in order, empty keys omitted, {out} bound"

trial:
  llm: openai
  network: local                        # @ai-sdk/openai-compatible ships inside the binary: no npm fetch
  env:
    PATH: ${path}
    HOME: ${home}
    TMPDIR: ${home}/tmp
    XDG_CONFIG_HOME: ${home}/.config
    XDG_DATA_HOME: ${home}/.local/share
    XDG_STATE_HOME: ${home}/.local/state
    XDG_CACHE_HOME: ${home}/.cache
    OPENCODE_DISABLE_CLAUDE_CODE: "1"
    OPENCODE_DISABLE_AUTOUPDATE: "1"
    OPENCODE_DISABLE_MODELS_FETCH: "1"     # 2.x fetches the models catalog at start: fenced, it waits — the ghost needs none
    OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
    OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
    OPENCODE_SERVER_PASSWORD: ghost         # the served probe's server demands one; its clients send it
    OPENCODE_PASSWORD: ghost
    OPENCODE_CONFIG_CONTENT: '{"enabled_providers":["ghost"],"providers":{"ghost":{"name":"ghost","package":"@opencode/ai/providers/openai-compatible","settings":{"baseURL":"${llm}/v1","apiKey":"ghost"},"models":{"x":{"name":"x","capabilities":{"tools":true,"input":["text"],"output":["text"]},"limit":{"context":200000,"output":8192}}}}},"model":"ghost/x","small_model":"ghost/x","plugin":[],"mcp":${mcp}}'
  overlays:                             # 2.x serve reads no OPENCODE_CONFIG_CONTENT: the sandbox copy itself carries the ghost
    - path: ${home}/.config/opencode/opencode.jsonc
      format: json
      set:
        providers: {ghost: {name: ghost, package: "@opencode/ai/providers/openai-compatible", settings: {baseURL: "${llm}/v1", apiKey: ghost}, models: {x: {name: x, capabilities: {tools: true, input: [text], output: [text]}, limit: {context: 200000, output: 8192}}}}}
        enabled_providers: [ghost]
        model: ghost/x
        small_model: ghost/x
        plugin: []
        mcp: {}
  probes:
    - {name: session,  kind: capture, serve: [opencode, serve, --hostname, 127.0.0.1, --port, "${port}"], ready: [opencode, api, --server, "http://127.0.0.1:${port}", agent.list], argv: [opencode, run, --server, "http://127.0.0.1:${port}", --model, ghost/x, ghost]}
    - {name: agents,   kind: command, serve: [opencode, serve, --hostname, 127.0.0.1, --port, "${port}"], ready: [opencode, api, --server, "http://127.0.0.1:${port}", agent.list], argv: [opencode, api, --server, "http://127.0.0.1:${port}", agent.list]}
    - {name: commands, kind: command, serve: [opencode, serve, --hostname, 127.0.0.1, --port, "${port}"], ready: [opencode, api, --server, "http://127.0.0.1:${port}", agent.list], argv: [opencode, api, --server, "http://127.0.0.1:${port}", command.list]}
    - {name: workflows, kind: command, argv: [ls, "${tree}/workflows"]}   # no native type: /workflow reads these files
  sees:
    persona: [session]                  # AGENTS.md in the system message
    skill: [session]
    agent: [agents]                     # primary agents never reach the prompt: the server's agent list holds them all
    command: [commands]
    workflow: [workflows]
  notes: "OpenCode 2.x (pinned v2.2.0, stack.yaml): `run`/`api` always talk to an HTTP server, and a standalone one binds a random port the fence will not allow — so every probe serves `opencode serve` on the declared ${port} (password-protected in 2.x: OPENCODE_SERVER_PASSWORD / OPENCODE_PASSWORD) and connects with --server. `serve` reads no OPENCODE_CONFIG_CONTENT: the overlay bends the sandbox copy of opencode.jsonc instead — a v2 `providers` ghost answered by the fake, no plugins, no MCP (offline they hold the session). OPENCODE_DISABLE_MODELS_FETCH: the models catalog fetch would wait on the fence and leave the server 503. `run --model ghost/x`: the built-in build agent's own model would win over `model`. The session fails with 400 on purpose (a 500 is retried with backoff). Skills are seen in the session, agents and commands in the server's agent.list / command.list. Proven 3/3 on v2.2.0, 2026-10-28 (taxis transpile trial); the 1.x trial (--pure, debug skill) is history."
