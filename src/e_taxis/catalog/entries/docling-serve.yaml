id: docling-serve
kind: service
targets: [system]
scope: service
requires: []
recipes:
  any:
    primitive: compose
    with: {path: ~/.config/compose/docling, port: 45800}
probe: docker inspect -f '{{.Config.Image}}' docling
verify: docker inspect -f '{{.State.Running}}' docling | grep -q true
uninstall: {primitive: compose, with: {path: ~/.config/compose/docling, down: true}}
footprint: [~/.config/compose/docling, ~/.config/compose/data/docling]
owns: []
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer core/engineer/stack.yaml"}
