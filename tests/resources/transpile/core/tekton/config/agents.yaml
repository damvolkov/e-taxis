# agents — agentes que REGISTRA el runtime (no corpus): built-ins overrided
# y agentes de sistema/terceros. La biblioteca de agentes propia vive en
# core/tekton/agents/; aquí solo configuración de runtime agnóstica.
overrides:
  plan: { model: scout }                        # claude: sin equivalente → backend schema opencode
system:
  autolearn-reviewer:
    description: "Reviews past conversations for self-improvement opportunities"
    model: scout
    hidden: true
    steps: 20
    prompt: "Load the autolearn-reviewer skill and follow its instructions to review the attached conversation for learning opportunities. Take immediate action: record observations, update memory, create or patch skills."
    permission:
      bash: allow
      read: allow
      glob: allow
      grep: allow
      write: allow
      edit: deny
      webfetch: deny
      task: deny
      skill: allow
      external_directory: allow
