id: docling-mcp
kind: mcp
targets: [claudecode, opencode]
scope: user
requires: [docling]
recipes:
  any:
    primitive: claude-mcp
    with: {name: docling, package: "docling-mcp", note: "argv and env as e-engineer core/engineer/config/mcp.yaml renders them"}
probe: claude mcp get docling
verify: claude mcp get docling
uninstall: {primitive: claude-mcp, with: {name: docling, remove: true}}
footprint: [~/.claude.json#mcpServers.docling]
owns: []
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: out, minimal: out}, checked: 2026-10-15, evidence: "e-engineer core/engineer/config/mcp.yaml"}
