id: beads
kind: cli
targets: [system]
scope: project
requires: []
recipes:
  any:
    primitive: binary
    with: {url: "https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz", sha256: 3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c, member: bd, path: ~/.local/bin/bd, then: ["bd init --skip-agents --skip-hooks --quiet", "bd metrics off"]}
probe: bd version
verify: bd version
uninstall: {primitive: binary, with: {path: ~/.local/bin/bd}}
footprint: [~/.local/bin/bd, "<repo>/.beads", ~/.beads, ~/.dolt, ~/.config/bd]
owns: []
gate: {licence: null, secrets: [], confirm: true}
flags: {init: "--skip-agents --skip-hooks — by default bd init sets core.hooksPath (silences prek) and writes AGENTS.md, CLAUDE.md and Cursor rules", metrics: "on by default — bd metrics off"}
status: {profile: {house: per-project, company: per-project, minimal: out}, checked: 2026-10-15, evidence: "e-engineer docs/bench/memory.md"}
