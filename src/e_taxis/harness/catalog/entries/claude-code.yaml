id: claude-code
kind: harness
targets: [claudecode]
scope: machine
requires: []
recipes:
  claudecode:
    primitive: binary
    with: {installer: "https://claude.ai/install.sh", note: "native installer; npm is the fallback (Node 22+)"}
probe: claude --version
verify: claude --version
uninstall: {primitive: binary, with: {path: ~/.local/bin/claude}}
footprint: [~/.local/bin/claude, ~/.local/share/claude, ~/.claude]
owns: []
gate: {licence: null, secrets: [], confirm: false}
flags: {}
status: {profile: {house: floor, company: floor, minimal: floor}, checked: 2026-10-15, evidence: "e-nous core/tekton/stack.yaml"}
