id: env
kind: env
targets: [claudecode]
scope: user
requires: [tool]
recipes:
  claudecode:
    primitive: settings
    with: {file: ~/.claude/settings.json, env: {TOOL_ON: "1"}}
probe: grep -qs TOOL_ON "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json"
verify: grep -qs TOOL_ON "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/settings.json"
uninstall: {primitive: settings, with: {file: ~/.claude/settings.json}}
owns: [env.TOOL_ON]
status: {profile: {house: floor}, checked: 2026-10-15, evidence: fixture}
